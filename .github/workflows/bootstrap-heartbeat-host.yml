name: Legacy Heartbeat Host Diagnostic

# Historical Render-host inspection only.
# This workflow is intentionally NOT scheduled and cannot deploy, restart, mutate
# bootstrap state, or act as StegVerse heartbeat timing/execution authority.
on:
  workflow_dispatch:
    inputs:
      confirm_legacy_diagnostic:
        description: "Type LEGACY_DIAGNOSTIC_ONLY to inspect the retired Render host"
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: legacy-heartbeat-host-diagnostic
  cancel-in-progress: true

env:
  HEALTH_URL: https://master-records-heartbeat-host.onrender.com/health

jobs:
  diagnostic:
    if: inputs.confirm_legacy_diagnostic == 'LEGACY_DIAGNOSTIC_ONLY'
    runs-on: ubuntu-latest
    steps:
      - name: Record superseded authority posture
        run: |
          cat <<'EOF'
          legacy_provider_host=true
          canonical_heartbeat_host=false
          deployment_authority=false
          heartbeat_timing_authority=false
          worker_execution_authority=false
          automatic_retry=false
          repository_mutation=false
          canonical_continuation=StegVerse-Labs/.github#12
          sovereign_host_installer=StegVerse-Labs/.github:scripts/install_sovereign_heartbeat_service.py
          EOF

      - name: Probe retired host without mutating state
        shell: bash
        run: |
          set +e
          code="$(curl -sS -o /tmp/legacy-heartbeat-health.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "$HEALTH_URL")"
          rc=$?
          set -e
          echo "curl_returncode=$rc"
          echo "http_status=$code"
          test -f /tmp/legacy-heartbeat-health.json && cat /tmp/legacy-heartbeat-health.json || true

      - name: Enforce diagnostic-only invariant
        run: |
          echo 'This workflow does not deploy, restart, schedule, mutate, or activate the heartbeat.'
